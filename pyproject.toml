[project]
name = "appwrite-mcp-template"
version = "0.1.0"
description = "Stateless MCP server template for Appwrite Functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
